name: Kontroly kvality

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kontroly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kontrola:
    name: Python 3.14 · testy a formát
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Načíst zdrojový kód
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Připravit Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Nainstalovat vývojové závislosti
        run: python -m pip install -r requirements-dev.txt
      - name: Zkontrolovat kód
        run: ruff check .
      - name: Zkontrolovat formát
        run: ruff format --check .
      - name: Spustit testy
        run: pytest -q
      - name: Ověřit sestavení balíčku
        run: python scripts/build_release.py
      - name: Ověřit bílé znaky v Gitu
        run: git diff --check
