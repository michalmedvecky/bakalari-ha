name: Kontroly kvality

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kontroly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kontrola:
    name: HA ${{ matrix.homeassistant }} · Python 3.14
    strategy:
      fail-fast: false
      matrix:
        homeassistant: ['2026.3.4', '2026.10.1']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Načíst zdrojový kód
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Připravit Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: Nainstalovat vývojové závislosti
        env:
          HA_VERSION: ${{ matrix.homeassistant }}
        run: python -m pip install -r requirements-test.txt "homeassistant==$HA_VERSION"
      - name: Zkontrolovat kód
        run: ruff check .
      - name: Zkontrolovat formát
        run: ruff format --check .
      - name: Spustit testy
        run: pytest -q
      - name: Ověřit sestavení balíčku
        run: python scripts/build_release.py
      - name: Ověřit bílé znaky v Gitu
        run: git diff --check
