refresh:
  fields:
    entry_id:
      required: true
      selector: &id001
        config_entry:
          integration: bakalari
query:
  fields:
    entry_id:
      required: true
      selector: *id001
    endpoint:
      required: true
      selector:
        select:
          options:
          - api_versions
          - api_info
          - user
          - marks
          - new_marks
          - final_marks
          - measures
          - homeworks
          - homework_count
          - absence
          - received
          - sent
          - noticeboard
          - unread
          - noticeboard_unread
          - message_types
          - received_detail
          - sent_detail
          - timetable
          - permanent_timetable
          - events
          - my_events
          - public_events
          - substitutions
          - subjects
          - themes
          - payments
          - balance
          - payment_info
          - student_present
          - commissioners
          - new_consents
          - web_modules
          - classbook
          - lesson_tags
          - lesson_absence
          - lesson_past
          - lesson_timetable
    id:
      required: false
      selector: &id002
        text: {}
    parameters:
      required: false
      selector: &id003
        object: {}
mark_message_read:
  fields:
    entry_id:
      required: true
      selector: *id001
    message_id:
      required: true
      selector: *id002
set_homework_done:
  fields:
    entry_id:
      required: true
      selector: *id001
    homework_id:
      required: true
      selector: *id002
    done:
      required: true
      selector:
        boolean: {}
confirm_marks:
  fields:
    entry_id:
      required: true
      selector: *id001
    mark_ids:
      required: true
      selector: *id003
predict_marks:
  fields:
    entry_id:
      required: true
      selector: *id001
    marks:
      required: true
      selector: *id003
send_message:
  fields:
    entry_id:
      required: true
      selector: *id001
    message_type:
      required: true
      selector: *id002
    title:
      required: true
      selector: *id002
    text:
      required: true
      selector:
        text:
          multiline: true
    recipient_type:
      required: true
      selector: *id002
    recipients:
      required: true
      selector: *id003
    options:
      required: false
      selector: *id003
write_classbook:
  fields:
    entry_id:
      required: true
      selector: *id001
    record_id:
      required: true
      selector: *id002
    record:
      required: true
      selector: *id003
get_attachment:
  fields:
    entry_id:
      required: true
      selector: *id001
    attachment_id:
      required: true
      selector: *id002
web_login:
  fields:
    entry_id:
      required: true
      selector: *id001
